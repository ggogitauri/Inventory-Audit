# slam_toolbox parameters for the 2D simulated patrol.
# The only non-default that matters for this repo is base_frame: the simulator
# publishes base_link, not the TurtleBot-style base_footprint.
slam_toolbox:
  ros__parameters:
    use_sim_time: false
    base_frame: base_link
    odom_frame: odom
    map_frame: map
    scan_topic: /scan
    mode: mapping
    resolution: 0.05
    max_laser_range: 8.0
    minimum_time_interval: 0.2
    transform_publish_period: 0.05
    map_update_interval: 1.0
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
